name: Validate

# Körs på den isolerade HP/CI-VM:ns repo-specifika runner (#5).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-gate:
    name: Regressionstester genomförda
    needs: [tests, hassfest, hacs]
    if: always()
    # Ingen checkout eller PR-kod. Fork-spärrarna på den beständiga runnern
    # kvarstår; skipped får däremot inte räknas som genomförda tester.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Kräv körda och gröna kontroller
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
          HASSFEST_RESULT: ${{ needs.hassfest.result }}
          HACS_RESULT: ${{ needs.hacs.result }}
        run: |
          for result in "$TESTS_RESULT" "$HASSFEST_RESULT" "$HACS_RESULT"; do
            if [ "$result" != success ]; then
              echo "::error::Samtliga kontroller måste köras och lyckas: $result"
              exit 1
            fi
          done
  tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, shared-ci]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest
      - run: python -m compileall -q custom_components
      - run: pytest -q

  hassfest:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, shared-ci]
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, shared-ci]
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
