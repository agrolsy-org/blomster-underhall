name: Validate

# Publikt repo: isolerade engångsrunners hos GitHub, även för fork-PR:er.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest
      - run: python -m compileall -q custom_components
      - run: pytest -q

  regression-resultat:
    name: Regressionstester genomförda
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Kräv godkänt faktiskt testjobb
        env:
          TEST_RESULT: ${{ needs.tests.result }}
        run: |
          if [ "$TEST_RESULT" != "success" ]; then
            echo "Regressionstestjobbet är inte godkänt: $TEST_RESULT" >&2
            exit 1
          fi
          echo "Pytest-jobbet för denna commit är godkänt."

  hassfest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: hacs/action@main
        with:
          category: integration
