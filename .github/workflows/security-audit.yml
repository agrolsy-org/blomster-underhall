name: Säkerhetsskanning

on:
  schedule:
    - cron: '17 2 4 * *'  # den 4:e varje månad 02:17 UTC
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret-scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Hämta gitleaks
        run: |
          VER=8.21.2
          # SHA-256 för gitleaks_8.21.2_linux_x64.tar.gz enligt releasens checksums.txt.
          # Uppdatera båda värdena tillsammans vid versionsbyte.
          SHA256=5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o "$RUNNER_TEMP/gitleaks.tgz"
          echo "${SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      - name: Kör gitleaks på hela historiken
        run: '"$RUNNER_TEMP/gitleaks" detect --source . --redact --no-banner'
